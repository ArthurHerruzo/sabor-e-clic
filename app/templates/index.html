<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor & Clic - Cardápio Digital</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="main-header">
        <h1>Sabor & Clic</h1>
    </header>

    <main class="main-content">
        <section id="container-cardapio" aria-label="Cardápio"></section>

        <aside class="sidebar-carrinho">
            <h2>Seu Carrinho</h2>
            
            <ul id="lista-carrinho"></ul>
            <p id="total-carrinho">Total: <strong>R$ 0,00</strong></p>

            <form id="form-pedido">
                <div class="form-group">
                    <label for="nome-cliente">Seu Nome</label>
                    <input 
                        type="text" 
                        id="nome-cliente" 
                        name="nome_cliente" 
                        placeholder="Digite seu nome" 
                        autocomplete="name"
                        required
                    >
                </div>

                <button type="submit" class="btn-submit">Finalizar Pedido</button>
            </form>
        </aside>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>

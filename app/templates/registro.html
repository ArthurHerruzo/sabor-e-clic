<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sabor & Clic - Criar Conta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <h2>Criar Conta</h2>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert {{ category }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST">
                <label>Nome completo:</label>
                <input type="text" name="nome" required placeholder="Como deseja ser chamado?">
                
                <label>E-mail:</label>
                <input type="email" name="email" required placeholder="seu@email.com">
                
                <label>Senha:</label>
                <input type="password" name="senha" required placeholder="Crie uma senha segura">
                
                <button type="submit">Cadastrar e Entrar</button>
            </form>
            
            <p style="margin-top: 24px; font-size: 14px; text-align: center; color: #666;">
                Já possui cadastro? <br> <a href="{{ url_for('web.login') }}" style="display: inline-block; margin-top: 8px;">Fazer login</a>
            </p>
        </div>
    </div>
</body>
</html>
